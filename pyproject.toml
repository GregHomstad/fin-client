[project]
name = "fin-client"
version = "0.1.0"
description = "Local-first, offline personal finance advisor client for bank exports"
requires-python = ">=3.11"
dependencies = ["ofxparse>=0.21", "reportlab>=4.0", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
claude = ["anthropic>=1.0"]

[project.scripts]
fin-client = "fin_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fin_client = ["static/*"]
